<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 3500 2000">
  <title>Piso 1 · planta (sin apartamentos: entrada, local, salón comunal y parqueaderos)</title>
  <!--
    Descripción de Jacobo (2026-11-14): la única entrada peatonal es angosta, en el
    módulo 6 de la fachada; a la izquierda un local y a la derecha el salón comunal.
    Un pasillo largo llega hasta el fondo (escalera y ascensores) con una puerta a cada
    lado hacia los parqueaderos. Las puertas grandes de los costados son los garajes.
    Módulos de fachada de 2,69 m (13 en 35 m): garaje ×3 · local ×2 · puerta · salón ×2 · garaje ×5.
    La calle queda abajo (y = 2000).
  -->
  <g id="walls">
    <rect x="0" y="0" width="3500" height="20"/>
    <rect x="0" y="1980" width="3500" height="20"/>
    <rect x="0" y="0" width="20" height="2000"/>
    <rect x="3480" y="0" width="20" height="2000"/>
    <rect x="1335" y="20" width="10" height="1960"/>
    <rect x="1615" y="905" width="10" height="1075"/>
    <rect x="1345" y="905" width="820" height="10"/>
    <rect x="2155" y="20" width="10" height="895"/>
    <rect x="805" y="1290" width="530" height="10"/>
    <rect x="805" y="1300" width="10" height="680"/>
    <rect x="1625" y="1290" width="540" height="10"/>
    <rect x="2155" y="1300" width="10" height="680"/>
  </g>
  <g id="spaces">
    <polygon id="lobby" data-label="Entrada y pasillo" data-finish="baldosa" points="1345,915 1615,915 1615,1980 1345,1980"/>
    <polygon id="nucleo" data-label="Escalera y ascensores" data-finish="concreto" points="1345,20 2155,20 2155,905 1345,905"/>
    <polygon id="local" data-label="Local comercial" data-finish="baldosa" points="815,1300 1335,1300 1335,1980 815,1980"/>
    <polygon id="salon-social" data-label="Salón comunal" data-finish="baldosa" points="1625,1300 2155,1300 2155,1980 1625,1980"/>
    <polygon id="parqueadero-1" data-label="Parqueadero" data-finish="concreto" points="20,20 1335,20 1335,1290 805,1290 805,1980 20,1980"/>
    <polygon id="parqueadero-2" data-label="Parqueadero" data-finish="concreto" points="2165,20 3480,20 3480,1980 2165,1980 2165,1300 1625,1300 1625,915 2165,915"/>
  </g>
  <g id="openings">
    <rect data-type="door" x="1420" y="1980" width="120" height="20"/>
    <rect data-type="door" x="1420" y="905" width="120" height="10"/>
    <rect data-type="door" x="1335" y="980" width="10" height="100"/>
    <rect data-type="door" x="1615" y="980" width="10" height="100"/>
    <rect data-type="door" x="1615" y="1500" width="10" height="90"/>
    <rect data-type="door" x="1240" y="1290" width="80" height="10"/>
    <rect data-type="window" x="830" y="1980" width="490" height="20"/>
    <rect data-type="window" x="1640" y="1980" width="500" height="20"/>
    <rect data-type="door" x="40" y="1980" width="750" height="20"/>
    <rect data-type="door" x="2180" y="1980" width="1280" height="20"/>
  </g>
  <g id="furniture">
    <rect data-item="reception" x="1360" y="1700" width="60" height="180"/>
    <rect data-item="plant" x="1555" y="1910" width="45" height="45"/>
    <rect data-item="counter" x="830" y="1310" width="490" height="55"/>
    <rect data-item="chair" data-back="n" x="1000" y="1600" width="46" height="46"/>
    <rect data-item="table" x="1700" y="1450" width="200" height="90"/>
    <rect data-item="chair" data-back="s" x="1720" y="1400" width="44" height="44"/>
