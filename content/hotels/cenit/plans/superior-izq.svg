<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 540">
  <title>Superior · plano en centímetros</title>
  <g id="walls">
    <rect x="0" y="0" width="540" height="15"/>
    <rect x="0" y="525" width="540" height="15"/>
    <rect x="0" y="0" width="15" height="540"/>
    <rect x="525" y="0" width="15" height="540"/>
    <rect x="320" y="330" width="10" height="195"/>
    <rect x="330" y="320" width="195" height="10"/>
  </g>
  <g id="spaces">
    <polygon id="habitacion" data-finish="madera" points="15,15 525,15 525,320 320,320 320,525 15,525"/>
    <polygon id="bano" data-finish="baldosa" points="330,330 525,330 525,525 330,525"/>
  </g>
  <g id="openings">
    <rect data-type="door" x="160" y="525" width="90" height="15"/>
    <rect data-type="door" x="320" y="400" width="10" height="80"/>
    <rect data-type="window" x="50" y="0" width="170" height="15"/>
    <rect data-type="window" x="320" y="0" width="170" height="15"/>
    <rect data-type="window" x="0" y="50" width="15" height="170"/>
    <rect data-type="window" x="0" y="320" width="15" height="170"/>
  </g>
  <g id="furniture">
    <rect data-item="bed" data-back="e" x="325" y="60" width="200" height="160"/>
    <rect data-item="nightstand" x="480" y="15" width="45" height="40"/>
    <rect data-item="nightstand" x="480" y="225" width="45" height="45"/>
    <rect data-item="desk" data-back="w" x="15" y="330" width="55" height="150"/>
    <rect data-item="chair" data-back="w" x="75" y="380" width="45" height="45"/>
    <rect data-item="armchair" x="60" y="60" width="80" height="80"/>
    <rect data-item="rug" x="170" y="60" width="160" height="220"/>
    <rect data-item="shower" x="430" y="330" width="95" height="95"/>
    <rect data-item="sink" data-back="w" x="340" y="440" width="60" height="85"/>
    <rect data-item="toilet" data-back="s" x="470" y="470" width="40" height="55"/>
  </g>
</svg>
